name: Release artifacts
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        run: |
          mkdir dist
          cp target/${{ matrix.target }}/release/raad dist/
          cp LICENSE README.md dist/
          tar -czf raad-${{ matrix.target }}.tar.gz -C dist .
          shasum -a 256 raad-${{ matrix.target }}.tar.gz > raad-${{ matrix.target }}.sha256
      - run: python3 scripts/package.py --binary target/${{ matrix.target }}/release/raad --output raad-${{ matrix.target }}.mcpb
      - uses: actions/upload-artifact@v4
        with:
          name: raad-${{ matrix.target }}
          path: |
            raad-*.tar.gz
            raad-*.sha256
            raad-*.mcpb
