[package]
name = "raad"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "Commit-pinned, validated Git-backed application data"
license = "Apache-2.0"
repository = "https://github.com/sopops-dev/raad"

[dependencies]
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
fs2 = "0.4"
libc = "0.2"
jsonschema = { version = "0.61", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rmcp = { version = "3.11", features = ["transport-io", "schemars"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = { package = "serde_yaml_ng", version = "0.10" }
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std"] }
wait-timeout = "0.2"

[dev-dependencies]
tiny_http = "0.12"

[profile.release]
lto = "thin"
strip = true
