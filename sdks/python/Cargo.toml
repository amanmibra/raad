[package]
name = "raad-python"
version = "0.1.2"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "Native Python bindings for raad"
repository = "https://github.com/amanmibra/raad"

[lib]
name = "_native"
crate-type = ["cdylib"]
test = false
doctest = false

[dependencies]
raad = { path = "../..", default-features = false }
pyo3 = { version = "0.30", features = ["abi3-py310"] }
